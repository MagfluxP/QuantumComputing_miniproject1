[project]
name = "grover-sudoku"
version = "0.1.0"
description = "Grover search mini-project: 4x4 Sudoku in Qiskit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "qiskit>=1.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pylatexenc>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "jupyterlab>=4",
    "ipykernel>=6",
    "nbconvert>=7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grover_miniproject"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
